[package]
name = "resolution-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Verifiable Resolution-as-a-Service (RaaS) oracle and clearinghouse engine with cryptographic HTTP provenance, 128-bit fixed-point AST evaluation, multiplexed sports matrices, hash-chained audit ledgers, and 153-byte on-chain settlement receipts."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["oracle", "prediction-market", "cryptography", "ed25519", "settlement"]
categories = ["cryptography", "finance", "web-programming::http-server"]

[dependencies]
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.35", features = ["serde-str"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand = "0.8"
regex = "1.10"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.4"
http-body-util = "0.1"
