name: CI & Cryptographic Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, Clippy, Fuzz & Golden Vectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run strict static analysis (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, integration, property-fuzz & golden vector suites
        run: cargo test --locked

      - name: Run offline zero-trust bundle verifier against committed vector bundle
        run: cargo run --locked -- verify-bundle vectors/sample_canary_bundle.json
